      (function () {
        const HIGHLIGHT_ID = "__paletto_visual_edit_highlight__";
        const MESSAGES = {
          ENABLE: "paletto:visual-edit:enable",
          DISABLE: "paletto:visual-edit:disable",
          ELEMENT_CLICKED: "paletto:visual-edit:element-clicked",
        };

        let isEnabled = false;
        let highlightEl = null;
        let hoveredElement = null;

        function createHighlight() {
          if (highlightEl) return highlightEl;
          highlightEl = document.createElement("div");
          highlightEl.id = HIGHLIGHT_ID;
          highlightEl.style.cssText = `
      position: fixed;
      pointer-events: none;
      border: 2px solid #3b82f6;
      background-color: rgba(59, 130, 246, 0.1);
      z-index: 999999;
      display: none;
      transition: all 0.05s ease-out;
    `;
          document.body.appendChild(highlightEl);
          return highlightEl;
        }

        function removeHighlight() {
          if (highlightEl) {
            highlightEl.remove();
            highlightEl = null;
          }
        }

        function handleMouseMove(e) {
          if (!isEnabled || !highlightEl) return;

          const target = e.target;
          if (
            target.id === HIGHLIGHT_ID ||
            target === document.documentElement ||
            target === document.body
          ) {
            highlightEl.style.display = "none";
            hoveredElement = null;
            return;
          }

          if (hoveredElement === target) return;
          hoveredElement = target;
          const rect = target.getBoundingClientRect();
          highlightEl.style.display = "block";
          highlightEl.style.top = rect.top + "px";
          highlightEl.style.left = rect.left + "px";
          highlightEl.style.width = rect.width + "px";
          highlightEl.style.height = rect.height + "px";
        }

        function handleMouseLeave() {
          if (highlightEl) {
            highlightEl.style.display = "none";
          }
          hoveredElement = null;
        }
        function handleClick(e) {
          if (!isEnabled) return;
          const target = e.target;

          if (
            target.id === HIGHLIGHT_ID ||
            target === document.documentElement ||
            target === document.body
          ) {
            return;
          }

          e.preventDefault();
          e.stopPropagation();

          const getSelectorPath = (el) => {
            const path = [];
            let current = el;
            while (current && current !== document.body) {
              let selector = current.tagName.toLowerCase();
              if (current.classList.length > 0) {
                const classList = Array.from(current.classList)
                  .slice(0, 2)
                  .join(".");

              path.unshift(selector);
              current = current.parentElement;
            }

            const tree = [];

            let lastComponentName = "";

              const compName = current.getAttribute("data-codexit-component");

                lastComponentName = compName;
              }
              current = current.parentElement;
            }

            return tree.length > 0 ? `<${tree.join("> <")}>` : "N/A";
          };

            let current = el;
            while (current && current !== document.body) {
              const source = current.getAttribute("data-codexit-source");
              if (source) return source;
              current = current.parentElement;
            }
            return "Unknown Source";
          };

            const root =
              typeof target === "string"
                ? document.querySelector(target)
                : target;

            if (!root) return "";

            const allElements = Array.from(root.querySelectorAll("*"));
            const leafElements = allElements.filter((el) => {
              const hasDirectText = Array.from(el.childNodes).some(
                (node) =>
                  node.nodeType === Node.TEXT_NODE &&
                  node.textContent.trim().length > 0,
              );

                "PATH",
                "BR",
                "STYLE",
                "SCRIPT",
              ].includes(el.tagName);
              return hasDirectText && isNotTechnical;
            });

            if (leafElements.length === 0) {
              const text = target.textContent ?? "";
              return text.substring(text, maxLength);
            }

            const perElementLimit = Math.max(
              Math.floor(maxLength / leafElements.length),
              10,
            );

            let result = leafElements
              .map((el) => {
                const tagName = el.tagName.toLowerCase();
                let text = el.textContent.trim().replace(/\s+/g, " ");

                if (text.length > perElementLimit) {
                  text = text.substring(0, perElementLimit) + "...";
                }

                return text;
              })
              .join("|");

              },
            },
            "*",

          document.addEventListener("mouseleave", handleMouseLeave, true);
          document.addEventListener("click", handleClick, true);

          } else if (type === MESSAGES.DISABLE) {
            disable();
          }
        });
      })();

      // THIS SCRIPT IS FOR CATCHING RUNTIME ERRORS
      // DOES NOT REMOVE
      (function() {
        var RUNTIME_ERROR_TYPE = 'paletto:runtime-error';
        var errorQueue = [];
        var MAX_ERRORS = 20;
        var DEBOUNCE_MS = 500;
        var debounceTimer = null;

        function sendErrors() {
          if (errorQueue.length === 0) return;
          var errors = errorQueue.splice(0, MAX_ERRORS);
          try {
            window.parent.postMessage({
              type: RUNTIME_ERROR_TYPE,
              payload: { errors: errors }
            }, '*');
          } catch (e) { /* ignore */ }
        }

        function queueError(err) {
          errorQueue.push(err);
          if (debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(sendErrors, DEBOUNCE_MS);
        }

        // Catch uncaught errors
        window.addEventListener('error', function(e) {
          // Ignore errors from extensions or cross-origin scripts
          if (!e.filename || e.filename === '') return;
          queueError({
            type: 'error',
            message: e.message || String(e.error),
            source: e.filename,
            line: e.lineno,
            column: e.colno,
            stack: e.error && e.error.stack ? e.error.stack : null
          });
        });

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          queueError({
            type: 'unhandledrejection',
            message: reason && reason.message ? reason.message : String(reason),
            stack: reason && reason.stack ? reason.stack : null
          });
        });

        // Intercept console.error to catch React/library errors
        var origConsoleError = console.error;
        console.error = function() {
          origConsoleError.apply(console, arguments);
          var msg = Array.prototype.map.call(arguments, function(a) {
            if (a instanceof Error) return a.message + (a.stack ? '\n' + a.stack : '');
            if (typeof a === 'object') { try { return JSON.stringify(a); } catch(e) { return String(a); } }
            return String(a);
          }).join(' ');
          queueError({
            type: 'console.error',
            message: msg
          });
        };
      })();
    </script>
    <script>
      // PALETTO NAVIGATION BROADCASTER — posts current path to parent on SPA navigation.
      (function () {
        var NAV_TYPE = "paletto:navigation:change";
        var lastPath = "";

        function currentPath() {
          return (location.pathname || "/") + (location.search || "") + (location.hash || "");
        }

        function broadcast() {
          var p = currentPath();
          if (p === lastPath) return;
          lastPath = p;
          try {
            window.parent.postMessage({ type: NAV_TYPE, payload: { path: p } }, "*");
          } catch (e) {
            /* ignore */
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", broadcast);
        } else {
          setTimeout(broadcast, 0);
        }

        window.addEventListener("popstate", broadcast);
        window.addEventListener("hashchange", broadcast);

        var origPush = history.pushState;
        var origReplace = history.replaceState;
        history.pushState = function () {
          var ret = origPush.apply(this, arguments);
          broadcast();
          return ret;
        };
        history.replaceState = function () {
          var ret = origReplace.apply(this, arguments);
          broadcast();
          return ret;
        };

        // Inbound: parent path bar requesting SPA navigation
        var REQ_TYPE = "paletto:navigation:request";
        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type !== REQ_TYPE) return;
          var path = data.payload && data.payload.path;
          if (typeof path !== "string" || !path) return;
          try {
            history.pushState({}, "", path);
            window.dispatchEvent(new PopStateEvent("popstate"));
            broadcast();
          } catch (e) {
            try { location.href = path; } catch (err) { /* ignore */ }
          }
        });
      })();
